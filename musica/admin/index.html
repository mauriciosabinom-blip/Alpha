<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#0f0c1a">
<title>Refrão · Painel</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<style>
  :root{--bg:#0f0c1a;--bg2:#181330;--text:#f7f4ff;--muted:#b4aecb;--line:rgba(255,255,255,.12);--glass:rgba(255,255,255,.06);
    --a:#8b5cf6;--b:#ec4899;--ok:#34d399;--warn:#fbbf24;--no:#fb7185}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
  .wrap{max-width:860px;margin:0 auto;padding:max(14px,env(safe-area-inset-top)) 16px 40px}
  .hidden{display:none!important}
  .muted{color:var(--muted)} .small{font-size:.85rem}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:16px}
  .logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.2rem}
  .logo i{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-style:normal;background:linear-gradient(135deg,var(--a),var(--b))}
  .btn{border:1px solid var(--line);background:var(--glass);color:var(--text);border-radius:12px;padding:10px 14px;font:700 .92rem inherit;font-family:inherit;cursor:pointer}
  .btn.primary{border:0;background:linear-gradient(135deg,var(--a),var(--b))}
  .btn.ok{border:0;background:#059669}
  .btn.no{background:transparent;border-color:#fb718580;color:#fecdd3}
  .btn:disabled{opacity:.5}
  .card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px}
  input{width:100%;background:#00000055;border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--text);font:1rem inherit;font-family:inherit;outline:none}
  input:focus{border-color:var(--a)}
  label{display:block;font-weight:700;font-size:.9rem;margin:12px 0 6px}
  .login{max-width:380px;margin:12vh auto 0}
  .err{color:var(--no);min-height:1.3em;margin-top:10px;font-size:.92rem}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:16px}
  .stat{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:12px;text-align:center}
  .stat b{display:block;font-size:1.6rem}
  .stat span{font-size:.75rem;color:var(--muted)}
  .stat.hot{border-color:#fbbf2488;background:#fbbf2414}
  .tabs{display:flex;gap:6px;padding:5px;border-radius:16px;background:var(--glass);border:1px solid var(--line);margin-bottom:12px}
  .tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:700 .95rem inherit;font-family:inherit;padding:10px;border-radius:12px;cursor:pointer}
  .tabs button.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff}
  .tools{display:flex;gap:8px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
  .tools input{flex:1;min-width:160px}
  .filter{display:flex;gap:6px}
  .filter button{border:1px solid var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:6px 12px;font:600 .85rem inherit;font-family:inherit;cursor:pointer}
  .filter button.on{color:var(--text);border-color:var(--b)}
  .list{display:flex;flex-direction:column;gap:10px}
  .row{background:var(--glass);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px}
  .row.pend{border-color:#fbbf2488}
  .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
  .who b{font-size:1.05rem}
  .badge{font-size:.75rem;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .b-pendente{background:#fbbf2426;color:#fde68a}.b-liberado,.b-ativo{background:#34d39926;color:#a7f3d0}
  .b-recusado,.b-expirado{background:#fb718526;color:#fecdd3}.b-teste{background:#60a5fa26;color:#bfdbfe}
  .meta{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:.88rem}
  .meta b{color:var(--text)}
  .acts{display:flex;flex-wrap:wrap;gap:8px}
  .acts .btn{flex:1;min-width:110px}
  .empty{text-align:center;color:var(--muted);padding:30px 10px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#2a2342;border:1px solid var(--line);padding:12px 18px;border-radius:14px;box-shadow:0 10px 30px #000a;max-width:90vw;text-align:center;z-index:9}
  @media (max-width:560px){.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo"><i>♪</i>Refrão · Painel</div>
    <div id="hdrRight" class="hidden" style="display:flex;gap:8px"><button class="btn" id="btnRefresh">🔄</button><button class="btn" id="btnOut">Sair</button></div>
  </header>

  <!-- login -->
  <div id="loginBox" class="login card">
    <h2 style="margin:0 0 4px">Entrar como administrador</h2>
    <p class="muted small" style="margin:0">Use a sua conta do Refrão.</p>
    <form id="loginForm">
      <label>Usuário<input id="lUser" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="mauricio"></label>
      <label>Senha<input id="lPass" type="password" autocomplete="current-password"></label>
      <button class="btn primary" style="width:100%;margin-top:16px;padding:13px">Entrar</button>
      <div class="err" id="lErr"></div>
    </form>
  </div>

  <!-- sem permissão -->
  <div id="denied" class="login card hidden">
    <h2 style="margin:0 0 6px">🔒 Acesso restrito</h2>
    <p class="muted">Esta conta não é de administrador.</p>
  </div>

  <!-- painel -->
  <div id="panel" class="hidden">
    <div class="stats">
      <div class="stat hot"><b id="sPend">0</b><span>pedidos pendentes</span></div>
      <div class="stat"><b id="sAtivos">0</b><span>assinantes ativos</span></div>
      <div class="stat"><b id="sTeste">0</b><span>em teste agora</span></div>
      <div class="stat"><b id="sTotal">0</b><span>contas no total</span></div>
    </div>
    <div class="tabs"><button data-tab="pedidos" class="on">📋 Pagamentos informados</button><button data-tab="usuarios">👥 Usuários</button></div>

    <div id="tabPedidos">
      <div class="tools"><div class="filter"><button data-f="pendente" class="on">Pendentes</button><button data-f="todos">Todos</button></div></div>
      <div class="list" id="pedidos"></div>
    </div>
    <div id="tabUsuarios" class="hidden">
      <div class="tools"><input id="busca" placeholder="🔎 Buscar por @usuário ou nome"></div>
      <div class="list" id="usuarios"></div>
    </div>
  </div>
</div>
<div id="toast" class="toast hidden"></div>

<script src="../vendor/supabase.js"></script>
<script src="../config.js"></script>
<script>
  const CFG = window.REFRAO_CONFIG || {};
  const sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey, { auth: { persistSession: true, storageKey: 'refrao.admin', autoRefreshToken: true } });
  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const dt = iso => iso ? new Date(iso).toLocaleString('pt-BR', { day: '2-digit', month: '2-digit', year: '2-digit', hour: '2-digit', minute: '2-digit' }) : '—';
  const d = iso => iso ? new Date(iso).toLocaleDateString('pt-BR') : '—';
  const brl = v => 'R$ ' + Number(v).toFixed(2).replace('.', ',');
  let tt; const toast = (m, ms = 3500) => { const t = $('toast'); t.textContent = m; t.classList.remove('hidden'); clearTimeout(tt); tt = setTimeout(() => t.classList.add('hidden'), ms); };
  let pedidos = [], usuarios = [], filtro = 'pendente', timer = null;

  // login (mesmo esquema do app: @usuário + senha)
  $('loginForm').onsubmit = async e => {
    e.preventDefault(); $('lErr').textContent = '';
    const h = $('lUser').value.replace(/[^a-z0-9]/gi, '').toLowerCase(), pass = $('lPass').value;
    let { error } = await sb.auth.signInWithPassword({ email: h + '@usuarios.refrao.app', password: pass });
    if (error && /invalid/i.test(error.message)) {
      const r = await sb.rpc('login_email', { p_handle: h, p_password: pass });
      if (r.data) ({ error } = await sb.auth.signInWithPassword({ email: r.data, password: pass }));
    }
    if (error) { $('lErr').textContent = 'Usuário ou senha incorretos.'; return; }
    start();
  };
  $('btnOut').onclick = async () => { await sb.auth.signOut(); location.reload(); };
  $('btnRefresh').onclick = () => load(true);

  async function start() {
    const { data: s } = await sb.auth.getSession();
    if (!s.session) return;
    $('loginBox').classList.add('hidden'); $('hdrRight').classList.remove('hidden');
    const { data: adm, error } = await sb.rpc('is_admin');
    if (error) { $('denied').classList.remove('hidden'); $('denied').querySelector('p').textContent = 'O painel ainda não foi ativado no servidor (falta rodar o SQL do painel).'; return; }
    if (!adm) { $('denied').classList.remove('hidden'); return; }
    $('panel').classList.remove('hidden');
    await load(); clearInterval(timer); timer = setInterval(load, 30000);
  }
  async function load(manual) {
    const [a, b] = await Promise.all([sb.rpc('admin_pedidos'), sb.rpc('admin_usuarios', { p_busca: '' })]);
    if (a.error || b.error) { toast('Erro ao carregar: ' + (a.error || b.error).message); return; }
    const novos = (a.data || []).filter(p => p.status === 'pendente').length - pedidos.filter(p => p.status === 'pendente').length;
    if (pedidos.length && novos > 0) toast(`🔔 ${novos} novo(s) pedido(s) de pagamento!`, 5000);
    pedidos = a.data || []; usuarios = b.data || [];
    $('sPend').textContent = pedidos.filter(p => p.status === 'pendente').length;
    $('sAtivos').textContent = usuarios.filter(u => u.status === 'ativo').length;
    $('sTeste').textContent = usuarios.filter(u => u.status === 'teste').length;
    $('sTotal').textContent = usuarios.length;
    document.title = (+$('sPend').textContent ? `(${$('sPend').textContent}) ` : '') + 'Refrão · Painel';
    renderPedidos(); renderUsuarios();
    if (manual) toast('Atualizado ✓', 1500);
  }
  function renderPedidos() {
    const list = pedidos.filter(p => filtro === 'todos' || p.status === filtro);
    $('pedidos').innerHTML = list.length ? list.map(p => `
      <div class="row ${p.status === 'pendente' ? 'pend' : ''}">
        <div class="top"><div class="who"><b>@${esc(p.handle)}</b> <span class="muted">· ${esc(p.name)}</span></div><span class="badge b-${p.status}">${p.status}</span></div>
        <div class="meta"><span>Plano: <b>${esc(p.plan)}</b></span><span>Valor: <b>${brl(p.amount)}</b></span><span>Informado em <b>${dt(p.created_at)}</b></span>
          ${p.decided_at ? `<span>Decidido em ${dt(p.decided_at)}</span>` : ''}${p.paid_until && new Date(p.paid_until) > new Date() ? `<span>Acesso até <b>${d(p.paid_until)}</b></span>` : ''}</div>
        ${p.status === 'pendente' ? `<div class="acts"><button class="btn ok" data-lib="${p.id}" data-h="${esc(p.handle)}" data-plan="${esc(p.plan)}">✅ Comprovante ok — liberar ${esc(p.plan)}</button><button class="btn no" data-rec="${p.id}">✗ Recusar</button></div>` : ''}
      </div>`).join('') : `<div class="empty">${filtro === 'pendente' ? '🎉 Nenhum pedido pendente.' : 'Nenhum pedido ainda.'}</div>`;
  }
  function renderUsuarios() {
    const q = $('busca').value.trim().toLowerCase();
    const list = usuarios.filter(u => !q || u.handle.includes(q) || (u.name || '').toLowerCase().includes(q));
    $('usuarios').innerHTML = list.length ? list.map(u => `
      <div class="row ${u.pedidos_pendentes > 0 ? 'pend' : ''}">
        <div class="top"><div class="who"><b>@${esc(u.handle)}</b> <span class="muted">· ${esc(u.name)}</span></div><span class="badge b-${u.status}">${u.status}${u.plan && u.status === 'ativo' ? ' · ' + esc(u.plan) : ''}</span></div>
        <div class="meta"><span>Conta criada em <b>${dt(u.created_at)}</b></span>${u.paid_until ? `<span>Acesso até <b>${u.plan === 'cortesia' ? 'sem prazo' : d(u.paid_until)}</b></span>` : ''}${u.pedidos_pendentes > 0 ? `<span style="color:#fde68a">⏳ ${u.pedidos_pendentes} pedido(s) pendente(s)</span>` : ''}</div>
        <div class="acts">
          <button class="btn" data-lib="" data-h="${esc(u.handle)}" data-plan="mensal">+1 mês</button>
          <button class="btn" data-lib="" data-h="${esc(u.handle)}" data-plan="anual">+1 ano</button>
          <button class="btn" data-lib="" data-h="${esc(u.handle)}" data-plan="cortesia">Cortesia</button>
          ${u.status === 'ativo' ? `<button class="btn no" data-rem="${esc(u.handle)}">Remover acesso</button>` : ''}
        </div>
      </div>`).join('') : '<div class="empty">Ninguém encontrado.</div>';
  }
  document.addEventListener('click', async e => {
    const tab = e.target.closest('[data-tab]');
    if (tab) { document.querySelectorAll('[data-tab]').forEach(b => b.classList.toggle('on', b === tab)); $('tabPedidos').classList.toggle('hidden', tab.dataset.tab !== 'pedidos'); $('tabUsuarios').classList.toggle('hidden', tab.dataset.tab !== 'usuarios'); return; }
    const f = e.target.closest('[data-f]');
    if (f) { filtro = f.dataset.f; document.querySelectorAll('[data-f]').forEach(b => b.classList.toggle('on', b === f)); renderPedidos(); return; }
    const lib = e.target.closest('[data-lib]');
    if (lib) {
      const h = lib.dataset.h, plan = lib.dataset.plan, txt = { mensal: '+1 mês', anual: '+1 ano', cortesia: 'cortesia (sem prazo)' }[plan];
      if (!confirm(`Liberar @${h} — ${txt}?`)) return;
      lib.disabled = true;
      const { data, error } = await sb.rpc('admin_liberar', { p_handle: h, p_plano: plan, p_pedido: lib.dataset.lib ? +lib.dataset.lib : null });
      toast(error ? 'Erro: ' + error.message : '✅ ' + data, 4500); await load(); return;
    }
    const rec = e.target.closest('[data-rec]');
    if (rec) { if (!confirm('Recusar este pedido? (o comprovante não confere)')) return; const { error } = await sb.rpc('admin_recusar', { p_pedido: +rec.dataset.rec }); toast(error ? 'Erro: ' + error.message : 'Pedido recusado'); await load(); return; }
    const rem = e.target.closest('[data-rem]');
    if (rem) { if (!confirm(`Remover o acesso de @${rem.dataset.rem}? Ele volta a ver a tela de assinatura.`)) return; const { data, error } = await sb.rpc('admin_remover_acesso', { p_handle: rem.dataset.rem }); toast(error ? 'Erro: ' + error.message : data); await load(); }
  });
  $('busca').oninput = renderUsuarios;
  start();
</script>
</body>
</html>
